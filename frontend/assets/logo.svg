<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 5)">
    <!-- Hexagonal / Shield Base -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#brandGrad)" />
    <!-- Dynamic Industrial Rhythm Wave -->
    <path d="M8 20 H13 L16 11 L21 29 L25 15 L28 23 L31 20 H34" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Pulse Node -->
    <circle cx="21" cy="29" r="2.5" fill="#10b981" />
    <circle cx="16" cy="11" r="2" fill="#60a5fa" />
  </g>

  <!-- Brand Typography -->
  <text x="56" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Algo<tspan fill="#2563eb">Rhythms</tspan>
  </text>
  
  <!-- Subtitle / SIH Tag -->
  <text x="57" y="41" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">
    SMART INDUSTRIAL COMPLIANCE
  </text>
</svg>
